[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-scheme-python"
version = "1.0.0"
description = "Локальный генератор структурных схем АСУ ТП"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "shapely>=2.0,<3", "Pillow>=10,<13", "resvg-py>=0.2,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6.100,<7", "httpx>=0.27,<1"]

browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["python*", "app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: реальные браузерные сценарии (Playwright + Chromium)"]
