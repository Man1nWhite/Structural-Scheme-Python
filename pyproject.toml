[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-scheme-python"
version = "1.0.0"
description = "Локальный генератор структурных схем АСУ ТП"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "shapely>=2.0,<3", "Pillow>=10,<13", "resvg-py>=0.2,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6.100,<7", "httpx>=0.27,<1"]

browser = ["playwright>=1.50,<2"]

lint = ["ruff>=0.6,<1"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Тесты намеренно импортируют весь публичный API ядра: это проверка контракта.
"tests/*" = ["F403", "F405"]

[tool.setuptools.packages.find]
include = ["python*", "app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: реальные браузерные сценарии (Playwright + Chromium)"]
