[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-scheme-python"
version = "1.0.0"
description = "Локальный генератор структурных схем АСУ ТП"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "shapely>=2.0,<3", "Pillow>=10,<13", "resvg-py>=0.2,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6.100,<7", "httpx>=0.27,<1", "pytest-cov>=5,<8"]

browser = ["playwright>=1.50,<2"]

lint = ["ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Тесты намеренно импортируют весь публичный API ядра: это проверка контракта.
"tests/*" = ["F403", "F405"]

[tool.setuptools.packages.find]
include = ["python*", "app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.mypy]
files = ["python", "app", "generate.py"]
# Проверяем тела функций без аннотаций: аннотировать каждую функцию не требуется,
# но опечатки и несовместимые типы внутри ловятся.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# Сторонние библиотеки без стабов: типы их вызовов не наши.
module = ["shapely.*", "resvg_py.*", "PIL.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["python", "app"]
branch = true

[tool.coverage.report]
show_missing = true
# Измерено 97% (branch). Порог 95 — защита от потери целых групп проверок.
fail_under = 95

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: реальные браузерные сценарии (Playwright + Chromium)"]
