name: Python tests
on: [push, pull_request]
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test,lint]"
      - run: python -m ruff check .
      - run: python -m mypy
      - name: Основные проверки
        shell: bash
        # При падении строки отчёта превращаются в аннотации: причина видна
        # прямо в PR, не только в скачиваемом логе шага.
        run: |
          log="${RUNNER_TEMP:-/tmp}/pytest.log"
          python -m pytest -q -m "not browser" --tb=line --cov --cov-report=term-missing > "$log" 2>&1
          status=$?
          cat "$log"
          if [ $status -ne 0 ]; then
            tail -n 40 "$log" | sed 's/^/::error::/'
          fi
          exit $status

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/browser -q --strict-markers
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
